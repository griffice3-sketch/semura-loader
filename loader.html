<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- キャッシュさせない（毎回最新のloaderを取りに来るように） -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Semura Lab.</title>
<link rel="preconnect" href="https://semura-top.streamlit.app">
<style>
  /* loader自身は縦スクロールしない。縦スクロールはSTUDIO側(親iframe)に集約。 */
  html, body { margin:0; background:#FFFFFF; overflow:hidden; }
  /* streamlit本体：画面固定をやめ、縦長の“普通のiframe”にする（STUDIO埋め込みで実績ある方式） */
  /* Streamlit Cloud が embed 時に外周コンテナ(_streamlitAppContainer)へ強制付与する
     border:2px + border-radius:12px は streamlit.app 側DOMのため外から編集不可。
     そこで iframe 自身の表示領域を 2px 内側で四角くクリップし、枠と角丸を境界外へ追い出す。
     角が滲む場合は inset(2px) → inset(3px) と 1px ずつ上げる。 */
  #app { display:block; width:100%; height:4000px; border:0; background:#FFFFFF;
    clip-path: inset(6px); }
  #footmask { position:fixed; left:0; right:0; bottom:0; height:50px;
    background:#FFFFFF; z-index:3; pointer-events:none; }
  /* ── ロード画面 ──
     position:fixed は多重iframeの中だと“見えない位置”へ逃げることがあるため、
     親(body)基準の position:absolute で必ず最上部(top:0)に貼り付ける。
     上端から padding-top で少し下げた位置に内容を出す＝確実に見える位置。 */
  #overlay { position:absolute; top:0; left:0; right:0; min-height:100vh; z-index:5;
    background:#FFFFFF;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    gap:16px; padding-top:64px;
    font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif; }
  #overlay .brand { font-size:22px; font-weight:700; color:#1A1A1A; }
  #overlay .rule { width:46px; height:2px; background:#111111; }
  #overlay .spinner { width:34px; height:34px; border:3px solid #E6E8EC; border-top-color:#33485E;
    border-radius:50%; animation:spin .9s linear infinite; }
  #overlay .bar { width:200px; height:4px; border-radius:999px; background:#E9ECEF; overflow:hidden; }
  #overlay .bar > i { display:block; height:100%; width:0%; border-radius:999px;
    background:#33485E; transition:width .25s linear; }
  #overlay .msg { font-size:15px; color:#6B6B6B; letter-spacing:.03em; transition:opacity .3s ease; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <div id="overlay">
    <div class="brand">Semura&nbsp;Lab.</div>
    <div class="rule"></div>
    <div class="spinner"></div>
    <div class="bar"><i id="ovbar"></i></div>
    <div class="msg" id="ovmsg">解析エンジンを起動しています…</div>
  </div>
  <!-- src は最初は空。ステルス判定が固まってからJSで差し込む（下記参照）。 -->
  <iframe id="app" title="Semura Lab."></iframe>
  <div id="footmask"></div>

  <script>
    // ─────────────────────────────────────────────────────────────
    // ステルス転送（船長PC除外） ※リクエスト/レスポンス型
    //   親(semura-lab.com)とこのloader(github.io)はドメインが違い localStorageを共有できない。
    //   【投げっぱなしだと競合する】ため、loaderから親へ「状態をくれ」と要求し、
    //   親の応答(stealth: true/false)を受け取ってから初めてStreamlitを起動する。
    //   これで「素起動が先に走ってステルス通知を取りこぼす」競合が原理的に起きない。
    //   保険として、親が応答しない異常時のみタイムアウトで素起動する。
    // ─────────────────────────────────────────────────────────────
    var STEALTH_PASS = "xyz";   // funnel_log.py / studio script の合言葉と一致させること
    var BASE_SRC = "https://semura-top.streamlit.app/?embed=true&embed_options=light_theme";

    // ── 言語転送 ──
    //   このloader自身のURL(?lang=en)を読み、Streamlit(#app)へ &lang=en として引き継ぐ。
    //   STUDIOの /en ページが loader.html?lang=en で埋め込む → ここで拾って top へ渡す。
    //   ステルス機構とは独立（別クエリ）。lang未指定なら日本語（付けない＝従来どおり）。
    var LANG = "";
    try {
      var _m = (location.search || "").match(/[?&]lang=([a-zA-Z]+)/);
      if (_m && _m[1].toLowerCase() === "en") LANG = "en";
    } catch (e) {}
    if (LANG === "en") { try { document.documentElement.lang = "en"; } catch (e) {} }
    function withLang(src) {
      return LANG ? (src + "&lang=" + LANG) : src;
    }

    var appEl   = document.getElementById('app');
    var started = false;   // iframeを起動したか（二重起動防止）

    // ── 枠の高さを中身に追従させる ──
    //   Streamlit本体(app.py)が実コンテンツ高さを postMessage({type:"semura:height"}) で送ってくる。
    //   それを受けて #app を中身ピッタリの高さに合わせる。固定4000pxだと短い結果で下に空白・
    //   長い展開で切れる問題を解消。通知が来ない異常時は #app 初期値(4000px)のままなので悪化しない。
    window.addEventListener('message', function(ev){
      var d = ev.data;
      if (d && d.type === "semura:height" && typeof d.height === "number" && d.height > 0) {
        appEl.style.height = Math.ceil(d.height) + "px";
      }
    });

    function startApp(stealth) {
      if (started) return;
      started = true;
      var src = stealth ? (BASE_SRC + "&stealth=" + encodeURIComponent(STEALTH_PASS))
                        : BASE_SRC;
      appEl.src = withLang(src);   // 言語(&lang=en)を最後に付与。ステルス有無に関わらず効く。
    }

    // 親からの応答を待つ。{ semura_stealth_state: true/false } が来たらその値で起動。
    window.addEventListener('message', function(ev) {
      var d = ev.data;
      if (d && typeof d.semura_stealth_state !== 'undefined') {
        startApp(d.semura_stealth_state === true);
      }
    });

    // 親へ「ステルス状態を教えてくれ」と要求する。
    // 親スクリプトの読み込み順に依存しないよう、複数回（即時・短間隔）要求を出す。
    function requestStealthState() {
      if (started) return;
      try { if (window.parent) window.parent.postMessage({ semura_stealth_query: true }, '*'); } catch (e) {}
    }
    requestStealthState();
    var qTimer = setInterval(function(){
      if (started) { clearInterval(qTimer); return; }
      requestStealthState();
    }, 300);

    // 異常時フォールバック：親が一定時間まったく応答しない場合のみ素起動。
    // （通常は親が即応答するのでここには来ない。応答が来たら startApp 済みで無視される。）
    setTimeout(function(){ clearInterval(qTimer); startApp(false); }, 4000);
    // ─────────────────────────────────────────────────────────────

    var SECONDS = 4.8;   // ← ロード画面の表示時間。調整はここだけ
    var bar = document.getElementById('ovbar');
    var msg = document.getElementById('ovmsg');

    // ロード画面の文言（言語対応）。lang=en なら英語、既定は日本語。
    var OV_MSG_INIT = LANG === "en" ? "Starting the analysis engine\u2026" : "解析エンジンを起動しています…";
    var OV_MSG_SOON = LANG === "en" ? "Starting shortly\u2026" : "まもなく起動します";
    msg.textContent = OV_MSG_INIT;

    // 進捗バー：最初速く→後半粘り、終盤95%付近。実起動とは非連動の演出。
    var total = SECONDS * 1000, t0 = Date.now();
    var tick = setInterval(function(){
      var k = Math.min(1, (Date.now() - t0) / total);
      var pct = 95 * (1 - Math.pow(1 - k, 2.2));
      bar.style.width = pct.toFixed(1) + '%';
    }, 80);

    // 文言：3.3秒までは初期化、以降は「まもなく」
    setTimeout(function(){
      msg.style.opacity = 0;
      setTimeout(function(){ msg.textContent = OV_MSG_SOON; msg.style.opacity = 1; }, 300);
    }, 3300);

    // SECONDS 経過でバーを満たして overlay を消す（時間で確実に消える）
    setTimeout(function(){
      clearInterval(tick);
      bar.style.width = '100%';
      setTimeout(function(){
        var o = document.getElementById('overlay'); if (o) o.style.display = 'none';
      }, 180);
    }, SECONDS * 1000);
  </script>
</body>
</html>
