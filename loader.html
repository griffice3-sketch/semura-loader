<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semura Lab.</title>

<!-- 同時発射：streamlitへの接続を最上部で先行 -->
<link rel="preconnect" href="https://semura-top.streamlit.app" crossorigin>
<link rel="dns-prefetch" href="https://semura-top.streamlit.app">

<!-- 同時発射：他より先に streamlit 本体(iframe)を起動。裏で勝手に走る（ロード画面とは無関係） -->
<script>
  var SRC = "https://semura-top.streamlit.app/?embed=true&embed_options=light_theme";
  document.write('<iframe id="app" title="Semura Lab." src="'+SRC+'"></iframe>');
</script>

<style>
  html,body{margin:0;height:100%;background:#FFFFFF;}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#FFFFFF;z-index:1;}
  #footmask{position:fixed;left:0;right:0;bottom:0;height:50px;background:#FFFFFF;z-index:3;pointer-events:none;}
  /* ロード画面：完全に独立。タイマーで自分の都合だけで消える（streamlitの状態は一切見ない） */
  #overlay{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;gap:18px;padding-top:64px;
    background:#FFFFFF;color:#1A1A1A;
    font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;}
  #overlay .brand{font-size:22px;font-weight:700;}
  #overlay .rule{width:46px;height:2px;background:#111111;}
  #overlay .spinner{width:34px;height:34px;border:3px solid #E6E8EC;border-top-color:#33485E;
    border-radius:50%;animation:spin .9s linear infinite;}
  #overlay .msg{font-size:15px;color:#6B6B6B;letter-spacing:.03em;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
  <!-- 同時発射：ロード画面 -->
  <div id="overlay">
    <div class="brand">Semura&nbsp;Lab.</div>
    <div class="rule"></div>
    <div class="spinner"></div>
    <div class="msg">準備しています…</div>
  </div>
  <div id="footmask"></div>

  <script>
    // ロード画面は独立。タイマーが切れたら消す。それだけ。
    var SECONDS = 2.5;   // ← 調整はここだけ
    setTimeout(function(){
      var o=document.getElementById('overlay'); if(o) o.style.display='none';
    }, SECONDS*1000);
  </script>
</body>
</html>
