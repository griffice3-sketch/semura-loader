<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semura Lab.</title>

<!-- ① アクセスした瞬間、streamlitの起動を"同時"に開始（接続・取得を先行で温める） -->
<link rel="preconnect" href="https://semura-top.streamlit.app" crossorigin>
<link rel="dns-prefetch" href="https://semura-top.streamlit.app">
<link rel="prefetch" as="document"
  href="https://semura-top.streamlit.app/?embed=true&embed_options=light_theme">

<style>
  html,body{margin:0;height:100%;background:#FFFFFF;}
  /* ② ロード画面（このページ自身がロード画面。埋め込み窓は使わない） */
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;gap:18px;padding-top:64px;
    background:#FFFFFF;color:#1A1A1A;
    font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;}
  #overlay .brand{font-size:22px;font-weight:700;}
  #overlay .rule{width:46px;height:2px;background:#111111;}
  #overlay .spinner{width:34px;height:34px;border:3px solid #E6E8EC;border-top-color:#33485E;
    border-radius:50%;animation:spin .9s linear infinite;}
  #overlay .msg{font-size:15px;color:#6B6B6B;letter-spacing:.03em;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #dbg{position:fixed;right:6px;bottom:6px;font:11px monospace;color:#CFCFCF;}
</style>
</head>
<body>
  <div id="overlay">
    <div class="brand">Semura&nbsp;Lab.</div>
    <div class="rule"></div>
    <div class="spinner"></div>
    <div class="msg">準備しています…</div>
  </div>
  <div id="dbg">t=0.0s</div>

  <script>
    // ③ アクセスと同時に streamlit を裏で温める（fetchで起動を促す）＋ タイマー始動。
    var URL = "https://semura-top.streamlit.app/?embed=true&embed_options=light_theme";
    try { fetch(URL, {mode:"no-cors"}); } catch(e) {}   // 起動を“同時発射”（no-corsで投げるだけ）

    var t0 = Date.now(), dbg = document.getElementById('dbg');
    var tick = setInterval(function(){ dbg.textContent = "t="+((Date.now()-t0)/1000).toFixed(1)+"s"; }, 100);

    // ④ タイマー（2秒）が切れたら streamlit 本体へ移動＝表示。秒数はここだけ変えれば変わる。
    var SECONDS = 2.0;
    setTimeout(function(){
      clearInterval(tick);
      location.replace(URL);
    }, SECONDS * 1000);
  </script>
</body>
</html>
