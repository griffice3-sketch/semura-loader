<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ▼ 何よりも先に streamlit への接続・取得を開始（loader表示と"同時"に起動させる） -->
<link rel="preconnect" href="https://semura-top.streamlit.app" crossorigin>
<link rel="dns-prefetch" href="https://semura-top.streamlit.app">
<link rel="preload" as="document" href="https://semura-top.streamlit.app/?embed=true&embed_options=light_theme">
<title>Semura Lab.</title>
<style>
  html,body{margin:0;height:100%;background:#FFFFFF;}
  #app{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#FFFFFF;}
  #footmask{position:fixed;left:0;right:0;bottom:0;height:50px;background:#FFFFFF;z-index:3;pointer-events:none;}
  /* ロード画面：描画が乗るまで覆う（往復のチラつきも隠す）。フォント等で起動は待たせない */
  #overlay{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;gap:18px;padding-top:64px;background:#FFFFFF;color:#1A1A1A;
    font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;transition:opacity .5s ease;}
  #overlay.hide{opacity:0;pointer-events:none;}
  #overlay .brand{font-size:22px;font-weight:700;}
  #overlay .rule{width:46px;height:2px;background:#111111;}
  #overlay .spinner{width:34px;height:34px;border:3px solid #E6E8EC;border-top-color:#33485E;
    border-radius:50%;animation:spin .9s linear infinite;}
  #overlay .msg{font-size:15px;color:#6B6B6B;letter-spacing:.03em;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
  <!-- ▼ iframe を文書の最初に置き、src を即セット＝STUDIOがloaderを開いた瞬間にstreamlit起動を開始（並行） -->
  <iframe id="app" title="Semura Lab."
    src="https://semura-top.streamlit.app/?embed=true&embed_options=light_theme"></iframe>

  <div id="overlay">
    <div class="brand">Semura&nbsp;Lab.</div>
    <div class="rule"></div>
    <div class="spinner" role="status" aria-label="読み込み中"></div>
    <div class="msg">準備しています…</div>
  </div>
  <div id="footmask"></div>

  <script>
    // ロード画面は load(=HTML到達・UI描画前)では消さない。
    // 実際にUIが描画された＝中身の高さが立ち上がった/streamlitが高さ通知を送った瞬間に、1回だけ消す。
    // → 真っ白の隙間も、起動時の往復チラつきも覆ったまま、描画と同時にすっと退く。
    (function(){
      var overlay=document.getElementById('overlay'), app=document.getElementById('app'), done=false;
      function reveal(){ if(done)return; done=true; overlay.classList.add('hide');
        setTimeout(function(){ if(overlay&&overlay.parentNode) overlay.parentNode.removeChild(overlay); },500); }
      function ready(){ try{ var d=app.contentDocument||(app.contentWindow&&app.contentWindow.document);
        if(d&&d.body&&d.body.scrollHeight>120) return true; }catch(e){} return false; }
      var poll=setInterval(function(){ if(ready()){ clearInterval(poll); reveal(); } },50);
      window.addEventListener('message',function(e){
        if(e&&e.data&&typeof e.data==='object'&&(e.data.type==='streamlit:setFrameHeight'||e.data.isStreamlitMessage)){
          clearInterval(poll); reveal(); }
      });
    })();
  </script>
</body>
</html>
