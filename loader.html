<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semura Lab.</title>
<link rel="preconnect" href="https://semura-top.streamlit.app">
<style>
  html, body { margin:0; height:100%; background:#FFFFFF; }
  #app { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; background:#FFFFFF; }
  #footmask { position:fixed; left:0; right:0; bottom:0; height:50px;
    background:#FFFFFF; z-index:1; pointer-events:none; }
  /* スピナーは iframe の“手前”(z-index:9)。streamlitの白背景より上でないと見えないため。
     消すのは app.py の描画完了合図(SEMURA_READY)。早すぎる素のloadでは消さない。 */
  #boot { position:fixed; inset:0; z-index:9; background:#FFFFFF;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    transition:opacity .4s ease; }
  #boot.hide { opacity:0; pointer-events:none; }
  #boot .spin { width:38px; height:38px; border-radius:50%;
    border:4px solid #D7DBE0; border-top-color:#33485E; animation:sp .8s linear infinite; }
  #boot .txt { font:14px/1 "Noto Sans JP",system-ui,sans-serif; color:#7A8694;
    letter-spacing:.05em; transition:opacity .3s ease; }
  /* 進捗バー：実起動とは非連動の演出。READYが来たら満ちて消える。 */
  #boot .bar { width:200px; height:4px; border-radius:999px; background:#E9ECEF; overflow:hidden; }
  #boot .bar > i { display:block; height:100%; width:0%; border-radius:999px;
    background:#33485E; transition:width .25s linear; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <div id="boot">
    <div class="spin"></div>
    <div class="bar"><i id="bootbar"></i></div>
    <div class="txt" id="boottxt">診断エンジンを初期化しています…</div>
  </div>
  <iframe id="app" title="Semura Lab."
    src="https://semura-top.streamlit.app/?embed=true&embed_options=light_theme"></iframe>
  <div id="footmask"></div>
  <script>
    var boot = document.getElementById('boot'), off = false;
    var bar  = document.getElementById('bootbar');
    var txt  = document.getElementById('boottxt');

    // ── 進捗バーの演出（実起動とは非連動）──
    //   最初は速く伸び、後半は粘って 95% で頭打ち。READY が来たら 100% にして消す。
    //   起動が速ければバーが途中でも消える（＝「最後までいってないのに起動」パターン）。
    var pct = 0;
    var tick = setInterval(function(){
      if (off) return;
      // 残り(95-pct)の一定割合ずつ詰める＝最初速く・後半ゆっくり
      pct += Math.max(0.4, (95 - pct) * 0.06);
      if (pct >= 95) { pct = 95; }
      bar.style.width = pct.toFixed(1) + '%';
    }, 120);

    // ── 文言切替：3.3秒までは初期化、以降は「まもなく」──
    var swap = setTimeout(function(){
      if (off) return;
      txt.style.opacity = 0;
      setTimeout(function(){
        if (off) return;
        txt.textContent = 'まもなく診断を開始します';
        txt.style.opacity = 1;
      }, 300);
    }, 3300);

    function hide(){
      if (off) return; off = true;
      clearInterval(tick); clearTimeout(swap);
      bar.style.width = '100%';           // READYが来たら満ちてから
      setTimeout(function(){ boot.classList.add('hide'); }, 180);
    }
    // app.py が「描画し終えた」合図を送ってきたら消す＝起動完了で消える(時間に依存しない)。
    window.addEventListener('message', function(e){ if (e && e.data === 'SEMURA_READY') hide(); });
    // 保険のみ：合図が来ない異常時だけ。正常時は SEMURA_READY で先に消える。
    setTimeout(hide, 10000);
  </script>
</body>
</html>
