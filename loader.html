<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semura Lab.</title>
<link rel="preconnect" href="https://semura-top.streamlit.app">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  html, body { margin:0; height:100%; background:#FFFFFF; }
  #app { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
  #overlay {
    position:absolute; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:18px;
    padding-top:64px;
    background:#FFFFFF; color:#1A1A1A;
    font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;
    transition:opacity .6s ease;
  }
  #overlay.hide { opacity:0; pointer-events:none; }
  #overlay .brand { font-size:22px; font-weight:700; letter-spacing:.01em; }
  #overlay .rule  { width:46px; height:2px; background:#111111; }
  #overlay .spinner {
    width:34px; height:34px; border:3px solid #E6E8EC; border-top-color:#33485E;
    border-radius:50%; animation:spin .9s linear infinite;
  }
  #overlay .msg { font-size:15px; color:#6B6B6B; letter-spacing:.03em; text-align:center; padding:0 16px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #footmask { position:fixed; left:0; right:0; bottom:0; height:50px;
    background:#FFFFFF; z-index:3; pointer-events:none; }
</style>
</head>
<body>
  <iframe id="app" title="Semura Lab."
    src="https://semura-top.streamlit.app/?embed=true&embed_options=light_theme"></iframe>

  <div id="overlay">
    <div class="brand">Semura&nbsp;Lab.</div>
    <div class="rule"></div>
    <div class="spinner" role="status" aria-label="読み込み中"></div>
    <div class="msg">準備しています…</div>
  </div>

  <div id="footmask"></div>

  <script>
    // 起動完了(load)で消す。待ち時間なし。
    var overlay = document.getElementById('overlay');
    document.getElementById('app').addEventListener('load', function () {
      overlay.classList.add('hide');
      setTimeout(function () {
        if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
      }, 600);
    });
  </script>
</body>
</html>
