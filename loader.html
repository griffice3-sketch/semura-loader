<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semura Lab.</title>
<link rel="preconnect" href="https://semura-top.streamlit.app">
<style>
  html, body { margin:0; height:100%; background:#FFFFFF; }
  /* iframeを全面表示するだけ。透明化・オーバーレイ等の小細工はしない＝直と同じ見え方。 */
  #app { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; background:#FFFFFF; }
  /* 埋め込み時にCloudが出す「Built with Streamlit」帯だけ、白帯で物理的に覆う */
  #footmask { position:fixed; left:0; right:0; bottom:0; height:50px;
    background:#FFFFFF; z-index:1; pointer-events:none; }
</style>
</head>
<body>
  <!-- 統合トップ(semura-top)。URLを隠す窓として中身をそのまま表示（直と同じ起動の見え方）。 -->
  <iframe id="app" title="Semura Lab."
    src="https://semura-top.streamlit.app/?embed=true&embed_options=light_theme"></iframe>
  <div id="footmask"></div>
</body>
</html>
