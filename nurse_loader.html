<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semura Lab. 整形外科・インフラ外来</title>
<link rel="preconnect" href="https://semura-nurse.streamlit.app">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  html, body { margin:0; height:100%; background:#FFFFFF; }
  #app { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
  #overlay {
    position:absolute; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:18px;
    padding-top:64px;
    background:#FFFFFF; color:#1A1A1A;
    font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;
    transition:opacity .6s ease;
  }
  #overlay.hide { opacity:0; pointer-events:none; }
  #overlay .brand { font-size:22px; font-weight:700; letter-spacing:.01em; }
  #overlay .rule  { width:46px; height:2px; background:#111111; }
  #overlay .spinner {
    width:34px; height:34px; border:3px solid #E6E8EC; border-top-color:#33485E;
    border-radius:50%; animation:spin .9s linear infinite;
  }
  #overlay .msg { font-size:15px; color:#6B6B6B; letter-spacing:.03em; text-align:center; padding:0 16px; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <iframe id="app" title="Semura Lab. 整形外科・インフラ外来"
    src="https://semura-nurse.streamlit.app/?embed=true&embed_options=light_theme&embed_options=hide_footer"></iframe>

  <div id="overlay">
    <div class="brand">Semura&nbsp;Lab.</div>
    <div class="rule"></div>
    <div class="spinner" role="status" aria-label="読み込み中"></div>
    <div class="msg">外来を準備しています… 数秒お待ちください</div>
  </div>

  <script>
    (function () {
      var overlay = document.getElementById('overlay');
      var app = document.getElementById('app');
      var done = false, start = Date.now();
      function hide() {
        if (done) return; done = true;
        var wait = Math.max(0, 700 - (Date.now() - start));
        setTimeout(function () {
          overlay.classList.add('hide');
          setTimeout(function () {
            if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
          }, 700);
        }, wait);
      }
      app.addEventListener('load', function () { setTimeout(hide, 2800); });
      setTimeout(hide, 12000);
    })();
  </script>
</body>
</html>
