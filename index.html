<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FXロジック再生クリニック ｜ Semura Lab.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#1A1A1A; --body:#333333; --muted:#6B6B6B; --line:#ECECEC;
    --line-strong:#111111; --surface:#FAFAFA;
    --green:#C8E6C1; --green-deep:#3C7A36;
    --yellow:#FCE9B3; --yellow-deep:#9A7B1E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#FFFFFF;}
  body{
    font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;
    color:var(--body); line-height:1.85;
  }
  .wrap{max-width:940px;margin:0 auto;padding:48px 20px 80px;}

  /* ── ヘッダー ── */
  .head{text-align:center;}
  .head .brand{font-size:30px;font-weight:700;color:var(--ink);letter-spacing:.01em;line-height:1.45;}
  .head .q{display:inline-block;font-size:20px;font-weight:700;color:var(--ink);
    border-bottom:2px solid var(--ink);padding-bottom:6px;margin:40px 0 0;}
  .head .lede{font-size:18px;color:var(--body);margin:30px 0 0;}

  /* ── 診療科の見出し ── */
  .cap{text-align:center;font-size:20px;font-weight:700;color:var(--ink);
    letter-spacing:.05em;margin:54px 0 30px;}
  .cap .sq{color:var(--ink);}

  /* ── 2カード ── */
  .cards{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;}
  .card{
    flex:1 1 320px;max-width:430px;border:0;border-radius:16px;cursor:pointer;
    padding:26px 24px;text-align:center;font-family:inherit;
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
    box-shadow:0 6px 18px rgba(90,80,40,.10);
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(90,80,40,.16);}
  .card:active{transform:translateY(0);}
  .card.green{background:var(--green);}
  .card.yellow{background:var(--yellow);}
  .card .t{font-size:20px;font-weight:700;line-height:1.5;}
  .card.green .t{color:#1f5a1b;}
  .card.yellow .t{color:#7a5f12;}
  .card .cta{display:block;margin-top:18px;font-size:15px;font-weight:700;}
  .card.green .cta{color:var(--green-deep);}
  .card.yellow .cta{color:var(--yellow-deep);}
  .card.active{outline:3px solid rgba(0,0,0,.12);}

  /* ── 展開パネル（アコーディオン） ── */
  .panel{
    margin-top:26px;border:1px solid var(--line);border-radius:16px;overflow:hidden;
    background:#FFFFFF;display:none;
  }
  .panel.open{display:block;animation:drop .35s ease;}
  .panel .bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--line);
    font-weight:700;color:var(--ink);font-size:15px;
  }
  .panel .bar .close{
    border:1px solid #C9CDD3;background:#fff;border-radius:8px;cursor:pointer;
    font-family:inherit;font-size:13px;color:#444;padding:6px 12px;
  }
  .panel .bar .close:hover{background:#EFEFEF;}
  .panel iframe{display:block;width:100%;height:1100px;border:0;background:#fff;}
  @keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">

  <!-- ヘッダー -->
  <div class="head">
    <div class="brand">FXロジック再生クリニック ｜ Semura Lab.</div>
    <div class="q">「自分のロジックは、本当にこのままで通用するのか？」</div>
    <p class="lede">ルールに対する漠然とした迷いや、いつか破綻するのではないかという不安。<br>
    「現在地」を見失ったあなたのロジックを、客観的に診断します。</p>
  </div>

  <!-- 診療科の見出し -->
  <div class="cap"><span class="sq">■</span>&nbsp;&nbsp;診療科のご案内&nbsp;&nbsp;<span class="sq">■</span></div>

  <!-- 2カード -->
  <div class="cards">
    <button class="card green" id="card-naika" onclick="openDept('naika')">
      <div class="t">★総合内科・外科<br>（ロジック治療）</div>
      <span class="cta">無料診断を受診したい方はこちら ▾</span>
    </button>
    <button class="card yellow" id="card-seikei" onclick="openDept('seikei')">
      <div class="t">★整形外科・インフラ外来<br>（環境構築）</div>
      <span class="cta">インフラ構築をご希望の方はこちら ▾</span>
    </button>
  </div>

  <!-- 展開パネル：内科（診断アプリ loader） -->
  <div class="panel" id="panel-naika">
    <div class="bar">
      <span>総合内科・外科 ― ロジック診断</span>
      <button class="close" onclick="closeAll()">閉じる ✕</button>
    </div>
    <iframe id="frame-naika" title="ロジック診断" loading="lazy"></iframe>
  </div>

  <!-- 展開パネル：整形外科（ナース loader） -->
  <div class="panel" id="panel-seikei">
    <div class="bar">
      <span>整形外科・インフラ外来 ― ご相談</span>
      <button class="close" onclick="closeAll()">閉じる ✕</button>
    </div>
    <iframe id="frame-seikei" title="インフラ外来" loading="lazy"></iframe>
  </div>

</div>

<script>
  // loader経由のURL（中身=本体URLは隠れる）
  var SRC = {
    naika:  "https://griffice3-sketch.github.io/semura-loader/loader.html",
    seikei: "https://griffice3-sketch.github.io/semura-loader/nurse_loader.html"
  };
  // iframeは初回オープン時にだけ読み込む（隠してる間は読みに行かない）
  var loaded = { naika:false, seikei:false };

  function openDept(which){
    var other = which === 'naika' ? 'seikei' : 'naika';
    // もう片方を閉じる
    document.getElementById('panel-'+other).classList.remove('open');
    document.getElementById('card-'+other).classList.remove('active');
    // 該当を開く
    var panel = document.getElementById('panel-'+which);
    var card  = document.getElementById('card-'+which);
    if(panel.classList.contains('open')){
      // 既に開いている同じ科を押したら閉じる
      panel.classList.remove('open'); card.classList.remove('active'); return;
    }
    if(!loaded[which]){
      document.getElementById('frame-'+which).src = SRC[which];
      loaded[which] = true;
    }
    panel.classList.add('open');
    card.classList.add('active');
    // 開いたパネルへスクロール
    setTimeout(function(){ panel.scrollIntoView({behavior:'smooth', block:'start'}); }, 80);
  }
  function closeAll(){
    ['naika','seikei'].forEach(function(w){
      document.getElementById('panel-'+w).classList.remove('open');
      document.getElementById('card-'+w).classList.remove('active');
    });
  }
</script>
</body>
</html>
